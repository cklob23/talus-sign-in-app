# The existing web service (talus-sign-in-app / srv-d5t7dkd6ubrc73avi9og) is
# dashboard-managed. Do not declare it here or a Blueprint sync will try to
# recreate or conflict with it. Cron jobs below can be created manually in
# the dashboard or applied via Blueprint.

services:
  - type: cron
    name: talus-auto-signout
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: echo skip
    startCommand: curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$TARGET_URL/api/auto-signout"
    envVars:
      - fromGroup: talus-cron

  - type: cron
    name: talus-scheduled-sync
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 * * * *"
    buildCommand: echo skip
    startCommand: curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" "$TARGET_URL/api/cron/scheduled-sync"
    envVars:
      - fromGroup: talus-cron

  # Caleb creates this Render cron in the dashboard. Blueprint entry documents
  # the intended job: every 15 minutes, send due booking invites, then hit the
  # reports endpoint (404 is OK until that route exists).
  - type: cron
    name: talus-reports
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: echo skip
    startCommand: >-
      sh -c 'curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$TARGET_URL/api/cron/booking-invites" &&
      code=$(curl -sS --max-time 120 -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $CRON_SECRET" "$TARGET_URL/api/cron/reports");
      [ "$code" = "200" ] || [ "$code" = "404" ]'
    envVars:
      - fromGroup: talus-cron

envVarGroups:
  - name: talus-cron
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: TARGET_URL
        value: http://talus-sign-in-app-qt7b:10000
