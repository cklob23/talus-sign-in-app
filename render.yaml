# The existing web service (talus-sign-in-app / srv-d5t7dkd6ubrc73avi9og) is
# dashboard-managed. Do not declare it here or a Blueprint sync will try to
# recreate or conflict with it. Cron jobs below can be created manually in
# the dashboard or applied via Blueprint.

services:
  - type: cron
    name: talus-auto-signout
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: echo skip
    startCommand: curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$TARGET_URL/api/auto-signout"
    envVars:
      - fromGroup: talus-cron

  - type: cron
    name: talus-scheduled-sync
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 * * * *"
    buildCommand: echo skip
    startCommand: curl -fsS --max-time 900 -H "Authorization: Bearer $CRON_SECRET" "$TARGET_URL/api/cron/scheduled-sync"
    envVars:
      - fromGroup: talus-cron

  # Dashboard cron talus-reports (crn-dbd2q8avcj2c739frivg). Both endpoints
  # always run; a failure on one does not skip the other. The job exits
  # non-zero if either curl fails.
  - type: cron
    name: talus-reports
    runtime: node
    plan: starter
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: echo skip
    startCommand: sh -c 'status=0; curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$TARGET_URL/api/cron/booking-invites" || status=1; curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$TARGET_URL/api/cron/reports" || status=1; exit $status'
    envVars:
      - fromGroup: talus-cron

envVarGroups:
  - name: talus-cron
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: TARGET_URL
        value: http://talus-sign-in-app-qt7b:10000
